<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>大野狼來了</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="gl"></div>

<div id="stars">⭐ <span id="starN">0</span></div>
<button id="gear" aria-label="家長設定(長按)">⚙️</button>

<div id="danger"></div>
<div id="hideMask"></div>
<div id="hush">🤫</div>
<div id="hint">👆</div>
<div id="winFx">⭐</div>

<canvas id="lunge"></canvas>
<img id="jumpImg" alt="" src="img/wolf_scary.jpg">
<svg id="slash" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M12 -5 L58 105"/><path d="M38 -5 L88 105"/><path d="M66 -5 L112 105"/></svg>
<div id="laugh"><img alt="" src="img/wolf_toon.jpg"></div>
<div id="flash"></div>

<div id="title">
  <img alt="" src="img/wolf_toon.jpg">
  <div class="entry">
    <button id="enterKid"><span class="ic">👦</span><span class="lb">小朋友</span></button>
    <button id="enterParent"><span class="ic">🔒</span><span class="lb">家長</span></button>
  </div>
</div>

<div id="pin" class="hidden">
  <div class="pinBox">
    <div class="pinTitle">🔒 請輸入家長密碼</div>
    <div id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div id="pinPad"></div>
  </div>
</div>

<div id="paused" class="hidden">⏸</div>

<div id="panel" class="hidden">
  <div class="panelBox">
    <h2>配對碼</h2>
    <label>配對碼 <span id="netState" style="font-weight:normal;font-size:13px"></span>
      <div class="row"><b id="roomCode" style="font-size:30px;letter-spacing:6px;flex:1">------</b><button id="newRoom">換新碼</button></div>
      <small style="font-weight:normal">媽媽手機開 parent.html 輸入此碼,其他設定都在媽媽手機調整</small>
    </label>
    <button id="closePanel" class="primary">關閉</button>
  </div>
</div>

<script src="js/firebase-config.js?v=3"></script>
<script src="js/net.js?v=3"></script>
<script src="js/sfx.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="js/game.js?v=14"></script>
</body>
</html>
